name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t flakeradar:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name fr -p 3000:3000 flakeradar:ci
          for i in $(seq 1 20); do curl -fsS localhost:3000/api/health && exit 0; sleep 1; done
          docker logs fr
          exit 1
